<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>photocraft</title>
  <!-- photocraft inside SynthOrg's Foto tab: one canvas filling the frame. The page that holds this
       frame sets the background before the app paints, so there is no flash of another colour. -->
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #photocraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #photocraft_loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 13px system-ui, sans-serif; opacity: 0.7; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="photocraft_canvas"></canvas>
  <div id="photocraft_loading"><p></p></div>
  <script type="module">
    import init from './photocraft-web.js';
    init({ module_or_path: new URL('./photocraft-web_bg.wasm', import.meta.url) }).catch(error => {
      document.getElementById('photocraft_loading').firstElementChild.textContent = String(error);
      window.synthorgHost?.failed?.(String(error));
    });
  </script>
</body>
</html>
