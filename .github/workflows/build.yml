name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: computer

jobs:
  test:
    name: test (node)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: computer/package-lock.json
      - run: npm ci
      - run: npm test

  bundle:
    name: bundle (${{ matrix.label }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
          - label: macos-aarch64
            platform: macos-latest
            target: aarch64-apple-darwin
          - label: macos-x86_64
            platform: macos-13
            target: x86_64-apple-darwin
          - label: linux-x86_64
            platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # WebKitGTK is the Linux webview; the rest is what the Tauri bundler
      # needs to produce .deb and .AppImage.
      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            libarchive-tools \
            file wget

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: computer/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: computer/src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - run: npm run setup:code

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: computer
          args: --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: synthorg-${{ matrix.label }}
          path: |
            computer/src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error
